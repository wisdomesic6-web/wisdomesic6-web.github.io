<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultimate ERP</title>
<style>
:root{
  --bg:#f6f8fb; --panel:#ffffff; --panel-2:#fbfcfe; --line:#e3e8ef; --text:#0f1722; --muted:#5b6b7b;
  --accent:#2f7bff; --accent-soft:#e8f0ff; --green:#13a877; --green-soft:#e4f7f0; --amber:#d98b06;
  --amber-soft:#fdf3e0; --danger:#e5484d; --danger-soft:#fdeaea; --chip:#eef2f7; --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  --sidebar:#101826; --sidebar-text:#c6d2e2; --sidebar-active:#2f7bff;
}
[data-theme="dark"]{
  --bg:#0f141a; --panel:#161c24; --panel-2:#1b222c; --line:#2a333f; --text:#e8eef5; --muted:#93a1b0;
  --accent:#4a8dff; --accent-soft:#1d2a3f; --green:#13c08a; --green-soft:#122a22; --amber:#e8a33d;
  --amber-soft:#2d2415; --danger:#ff5d5d; --danger-soft:#33191b; --chip:#222c38;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  --sidebar:#0b1017; --sidebar-text:#9fb0c4;
}
*{box-sizing:border-box}
/* must beat the display:grid on .shell / .login-wrap below */
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% -10%, var(--accent-soft), transparent),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:28px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.brand-name{font-size:17px;font-weight:650;letter-spacing:-.2px}
.login-sub{color:var(--muted);margin:0 0 20px;font-size:13px}
.field{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--line);
  background:var(--panel-2);border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.07);color:#fff}
.btn-danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-block{width:100%}
.btn-sm{padding:5px 9px;font-size:12.5px}
.btn-icon{padding:7px 9px}
.login-note{margin-top:16px;padding:11px 12px;background:var(--amber-soft);border-radius:8px;font-size:12.5px;color:var(--text)}
.err{color:var(--danger);font-size:13px;margin-bottom:12px;display:none}
.err.show{display:block}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;min-height:100vh;
  grid-template-areas:"side head" "side main"}
.sidebar{grid-area:side;background:var(--sidebar);color:var(--sidebar-text);padding:16px 12px;overflow-y:auto}
.sidebar .brand{padding:0 6px 16px;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.nav-group{margin-bottom:14px}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6b7c93;padding:0 8px;margin-bottom:6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;color:var(--sidebar-text);
  text-decoration:none;font-size:13.5px;margin-bottom:2px;cursor:pointer}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:550}
.nav-ico{width:18px;text-align:center;opacity:.9}
.topbar{grid-area:head;background:var(--panel);border-bottom:1px solid var(--line);padding:11px 20px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.search-wrap{position:relative;flex:1;max-width:420px}
.search-wrap .input{padding-left:32px}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);max-height:400px;overflow-y:auto;z-index:40;display:none}
.results.show{display:block}
.result-group{padding:6px 0;border-bottom:1px solid var(--line)}
.result-group:last-child{border-bottom:0}
.result-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 12px;font-weight:700}
.result-row{padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.result-row:hover{background:var(--accent-soft)}
.result-row .meta{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2)}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:650}
.user-chip .nm{font-size:13px;font-weight:550;line-height:1.1}
.user-chip .rl{font-size:11px;color:var(--muted);line-height:1.1}
.main{grid-area:main;padding:22px;max-width:1500px}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:21px;margin:0;letter-spacing:-.3px}
.page-sub{color:var(--muted);font-size:13px;margin:3px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-title{font-weight:650;font-size:14.5px}
.panel-body{padding:16px}
.panel-pad{padding:16px}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;
  background:var(--panel-2);position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.act{text-align:right;white-space:nowrap}
.row-link{cursor:pointer}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty-ico{font-size:28px;opacity:.5;margin-bottom:8px}

/* ---------- bits ---------- */
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:550;white-space:nowrap}
.chip-green{background:var(--green-soft);color:var(--green)}
.chip-amber{background:var(--amber-soft);color:var(--amber)}
.chip-red{background:var(--danger-soft);color:var(--danger)}
.chip-blue{background:var(--accent-soft);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.kpi-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.kpi-value{font-size:23px;font-weight:680;letter-spacing:-.5px;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi-note{font-size:12.5px;color:var(--muted);margin-top:3px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.toolbar .input{width:auto;min-width:150px}
.tabs{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:3px}
.tab{padding:6px 15px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;border:0;background:transparent}
.tab.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.totals{display:grid;gap:7px;min-width:240px;margin-left:auto}
.totals-row{display:flex;justify-content:space-between;gap:20px}
.totals-row.grand{border-top:1px solid var(--line);padding-top:7px;font-weight:700;font-size:16px}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.sm{font-size:12.5px}
.warn-banner{background:var(--amber-soft);border:1px solid transparent;border-radius:8px;padding:10px 13px;font-size:12.5px;margin-bottom:16px}

/* ---------- modal / toast ---------- */
dialog{border:1px solid var(--line);border-radius:13px;padding:0;background:var(--panel);color:var(--text);
  box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:min(860px,94vw);width:100%}
dialog::backdrop{background:rgba(8,12,18,.55);backdrop-filter:blur(2px)}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-title{font-weight:650;font-size:15.5px}
.modal-body{padding:18px;max-height:min(62vh,620px);overflow-y:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.x-btn{margin-left:auto;background:transparent;border:0;cursor:pointer;color:var(--muted);font-size:19px;line-height:1;padding:2px 5px}
.x-btn:hover{color:var(--danger)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:550;z-index:999;
  transition:.25s;pointer-events:none;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.danger{background:var(--danger);color:#fff}
#toast.ok{background:var(--green);color:#fff}

/* ---------- line items ---------- */
.items-table input,.items-table select{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent}
.items-table input:focus,.items-table select:focus{border-color:var(--accent);background:var(--panel-2);outline:none}
.items-table td{padding:4px 8px}
.items-table .num input{text-align:right}

/* ---------- charts ---------- */
.chart-box{height:210px;position:relative}
canvas{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12.5px}
.legend-item{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%}
.bar-list{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px}
.bar-track{grid-column:1/-1;height:7px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px}

/* ---------- print ---------- */
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  .shell,#toast,dialog{display:none !important}
  #printArea{display:block;padding:0}
  .doc{font-size:12px;color:#000}
  .doc h2{margin:0 0 2px}
  .doc table{width:100%;border-collapse:collapse;margin-top:14px}
  .doc th,.doc td{border-bottom:1px solid #ccc;padding:7px 8px;text-align:left}
  .doc th{background:#f2f4f7;font-size:10.5px;text-transform:uppercase}
  .doc .num{text-align:right}
  .doc .doc-head{display:flex;justify-content:space-between;gap:30px;border-bottom:2px solid #000;padding-bottom:12px}
  .doc .doc-totals{margin-top:16px;margin-left:auto;width:260px}
  .doc .doc-totals div{display:flex;justify-content:space-between;padding:4px 0}
  .doc .grand{border-top:1px solid #000;font-weight:700;font-size:14px}
  .doc .foot{margin-top:40px;font-size:11px;color:#444;border-top:1px solid #ccc;padding-top:8px}
}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr;grid-template-areas:"head" "side" "main"}
  .sidebar{display:flex;gap:6px;overflow-x:auto;padding:10px}
  .sidebar .brand,.nav-group-label{display:none}
  .nav-group{display:flex;gap:6px;margin:0}
  .nav-item{white-space:nowrap;margin:0}
  .main{padding:14px}
  .topbar{padding:10px 14px}
  .user-chip .nm,.user-chip .rl{display:none}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginScreen">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="brand"><div class="brand-mark">E</div><div><div class="brand-name" id="loginBrand">Ultimate ERP</div></div></div>
    <p class="login-sub">Sign in to the sales, payroll and accounting platform.</p>
    <div class="err" id="loginErr"></div>
    <div class="field">
      <label for="luser">User name</label>
      <input class="input" id="luser" list="userNames" placeholder="e.g. David Jenkins" required>
      <datalist id="userNames"></datalist>
    </div>
    <div class="field">
      <label for="lpw">Password</label>
      <input class="input" id="lpw" type="password" placeholder="••••" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    <div class="login-note" id="loginHint"></div>
  </form>
</div>

<!-- ============ APP ============ -->
<div class="shell" id="appShell" hidden>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">E</div><div class="brand-name" id="sideBrand">Ultimate ERP</div></div>
    <nav id="nav"></nav>
  </aside>
  <header class="topbar">
    <div class="search-wrap">
      <span class="search-ico">⌕</span>
      <input class="input" id="globalSearch" placeholder="Search orders, products, people…" autocomplete="off">
      <div class="results" id="searchResults"></div>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-icon" id="themeBtn" title="Toggle dark / light">🌙</button>
    <div class="user-chip">
      <div class="avatar" id="userAvatar">?</div>
      <div><div class="nm" id="userName">—</div><div class="rl" id="userRole">—</div></div>
    </div>
    <button class="btn btn-sm" id="logoutBtn">Sign out</button>
  </header>
  <main class="main" id="view"></main>
</div>

<div id="toast"></div>
<dialog id="modal"></dialog>
<div id="printArea"></div>

function parseDate(v){ if(!v) return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; }
function fmtDate(v){ const d = parseDate(v); return d ? `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}` : ''; }
function fmtDateNice(v){ const d = parseDate(v); return d ? d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : ''; }
function fmtTime(v){ const d = parseDate(v); return d ? `${pad2(d.getHours())}:${pad2(d.getMinutes())}` : ''; }
function dateInputValue(v){ return fmtDate(v); }
function dateTimeInputValue(v){ const d = parseDate(v); return d ? `${fmtDate(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}` : ''; }
function todayValue(){ return fmtDate(new Date()); }
function monthKey(v){ const d = parseDate(v); return d ? `${d.getFullYear()}-${pad2(d.getMonth()+1)}` : ''; }
function monthLabel(key){ const [y,m] = key.split('-'); return new Date(num(y), num(m)-1, 1).toLocaleDateString('en-US',{month:'short',year:'2-digit'}); }

/* ---------------------------- storage layer ----------------------------
   Everything the app does goes through loadDB/saveDB. To move to a cloud
   database later, only these two functions (and their async callers) change.
------------------------------------------------------------------------ */
const DB_KEY = 'erp_db_v1';
let db = null;

function loadDB(){
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) { db = JSON.parse(raw); migrate(); return; }
  } catch(e){ console.warn('Could not read saved data, starting from the workbook data.', e); }
  db = JSON.parse(JSON.stringify(SEED));
  saveDB();
}
function saveDB(){
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e){ toast('Could not save — browser storage is full or blocked', 'danger'); }
}
function migrate(){
  const s = JSON.parse(JSON.stringify(SEED));
  for (const k of Object.keys(s)) if (db[k] === undefined) db[k] = s[k];
  for (const k of Object.keys(s.settings)) if (db.settings[k] === undefined) db.settings[k] = s.settings[k];
}
function resetDB(){
  db = JSON.parse(JSON.stringify(SEED));
  saveDB();
}
const S = () => db.settings;
function nextId(coll){ return db[coll].reduce((m,r)=>Math.max(m, num(r.id)), 0) + 1; }

// Stock = purchases - sales, matched on product name (Excel SUMIFS was case-insensitive).
function stockIndex(){
  const m = new Map();
  for (const oi of db.orderItems){
    const k = String(oi.product || '').trim().toLowerCase();
    if (!k) continue;
    const delta = oi.type === 'PURCHASE' ? num(oi.qty) : -num(oi.qty);
    m.set(k, (m.get(k) || 0) + delta);
  }
  return m;
}
function productStock(name, idx){
  const k = String(name || '').trim().toLowerCase();
  return num((idx || stockIndex()).get(k));
}
function itemsForOrder(orderId){ return db.orderItems.filter(oi => oi.orderId === orderId); }
function taxRateFor(type){ return type === 'INVOICE' ? num(S().salesTaxRate) : num(S().poTaxRate); }
function orderTotals(order, items){
  const list = items || itemsForOrder(order.id);
  const subtotal = round2(list.reduce((s, oi) => s + num(oi.qty) * num(oi.price), 0));
  const rate = taxRateFor(order.type);
  const tax = round2(subtotal * rate);
  return { subtotal, tax, total: round2(subtotal + tax), rate };
}
function partyList(type){
  return (type === 'INVOICE' ? db.customers : db.vendors).map(p => p.name).filter(Boolean).sort();
}

/* ---- payroll ---- */
const PTO_HOURS_PER_DAY = 8;
function entryHours(e){
  const f = parseDate(e.from), t = parseDate(e.to);
  if (!f || !t) return 0;
  let h = (t - f) / 3600000;
  if (h < 0) h += 24;          // clocked out after midnight
  return h;
}
function periodsPerYear(){
  const f = (S().frequencies || []).find(x => x.name === (S().payFrequency || 'Monthly'));
  return num(f && f.periodsPerYear, 12);
}
// Split hours into regular / overtime per day, using the admin OT threshold.
function hoursInPeriod(employeeId, fromDate, toDate){
  const from = parseDate(fromDate), to = parseDate(toDate);
  if (to) to.setHours(23,59,59,999);
  const thr = num(S().overtimeDailyThreshold, 8);
  let regHours = 0, otHours = 0;
  const entries = [];
  for (const e of db.timesheets){
    if (num(e.employeeId) !== num(employeeId)) continue;
    const d = parseDate(e.date);
    if (!d) continue;
    if (from && d < from) continue;
    if (to && d > to) continue;
    const h = entryHours(e);
    regHours += Math.min(h, thr);
    otHours  += Math.max(h - thr, 0);
    entries.push(Object.assign({}, e, { hours: h }));
  }
  entries.sort((a,b) => String(a.date).localeCompare(String(b.date)));
  return { regHours: round2(regHours), otHours: round2(otHours), entries };
}
// Gross wages already paid this calendar year — drives the tax wage-base caps.
function ytdGross(employeeId, year, excludePayrollId){
  return db.paidEmployees.reduce((s,p) => {
    if (num(p.employeeId) !== num(employeeId)) return s;
    const d = parseDate(p.payDate);
    if (!d || d.getFullYear() !== year) return s;
    if (excludePayrollId != null && num(p.payrollId) === num(excludePayrollId)) return s;
    return s + num(p.grossPay);
  }, 0);
}
function computeTaxes(gross, employeeId, payDate, payrollId){
  const d = parseDate(payDate) || new Date();
  const prior = ytdGross(employeeId, d.getFullYear(), payrollId);
  return (S().taxItems || []).map(t => {
    let taxable = num(gross);
    if (t.baseLimit != null && num(t.baseLimit) > 0){
      taxable = Math.min(taxable, Math.max(0, num(t.baseLimit) - prior));  // annual wage base cap
    }
    return { name: t.name, rate: num(t.wagePercent), amount: round2(taxable * num(t.wagePercent)) };
  });
}
/* The core payroll calculation: hours -> regular/OT pay -> gross -> tax -> net. */
function computePay(opts){
  const emp = opts.employee, run = opts.payroll;
  const payType = opts.payType || emp.payType || 'Hourly';
  const { regHours, otHours, entries } = hoursInPeriod(emp.id, run.fromDate, run.toDate);
  const rate   = opts.rate   != null ? num(opts.rate)   : defaultRate(emp, payType);
  const otRate = opts.otRate != null ? num(opts.otRate) : num(emp.otRate);
  const ptoDays = num(opts.ptoDays);
  const additions  = (opts.additions  || []).filter(a => a.name);
  const deductions = (opts.deductions || []).filter(a => a.name);

  let regPay, otPay, ptoPay;
  if (payType === 'Hourly' || payType === 'Freelance'){
    regPay = round2(regHours * rate);
    otPay  = round2(otHours * (otRate || rate * 1.5));
    ptoPay = round2(ptoDays * PTO_HOURS_PER_DAY * rate);
  } else {                                  // Salary / Piece Work: fixed amount per period
    regPay = round2(rate);
    otPay  = 0;
    ptoPay = 0;                             // salary already covers paid time off
  }
  const additionsTotal  = round2(additions.reduce((s,a) => s + num(a.amount), 0));
  const deductionsTotal = round2(deductions.reduce((s,a) => s + num(a.amount), 0));
  const grossPay = round2(regPay + otPay + ptoPay + additionsTotal);
  const taxes = computeTaxes(grossPay, emp.id, run.payDate, run.id);
  const taxTotal = round2(taxes.reduce((s,t) => s + t.amount, 0));
  const netPay = round2(grossPay - taxTotal - deductionsTotal);
  return { payType, regHours, otHours, entries, rate, otRate, ptoDays, regPay, otPay, ptoPay,
           additions, deductions, additionsTotal, deductionsTotal, grossPay, taxes, taxTotal, netPay };
}
function defaultRate(emp, payType){
  const pt = payType || emp.payType;
  if (pt === 'Salary' || pt === 'Piece Work') return round2(num(emp.rate) / periodsPerYear());
  return num(emp.rate);
}
function paidFor(payrollId){ return db.paidEmployees.filter(p => num(p.payrollId) === num(payrollId)); }
function recalcRunTotals(payrollId){
  const run = db.payrolls.find(r => num(r.id) === num(payrollId));
  if (!run) return;
  const paid = paidFor(payrollId);
  run.gross = round2(paid.reduce((s,p) => s + num(p.grossPay), 0));
  run.net   = round2(paid.reduce((s,p) => s + num(p.netPay), 0));
}

/* ---- accounting ---- */
function plSummary(from, to){
  const f = parseDate(from), t = parseDate(to);
  if (t) t.setHours(23,59,59,999);
  const out = { Income:0, Expense:0, COGS:0 };
  for (const tr of db.transactions){
    const d = parseDate(tr.date);
    if (f && (!d || d < f)) continue;
    if (t && (!d || d > t)) continue;
    const k = tr.accountType;
    if (out[k] === undefined) continue;
    out[k] += num(tr.amount);
  }
  out.net = round2(out.Income - out.Expense - out.COGS);
  out.Income = round2(out.Income); out.Expense = round2(out.Expense); out.COGS = round2(out.COGS);
  return out;
}

function canAccess(moduleId){
  if (!currentUser) return false;
  const acc = ROLE_ACCESS[currentUser.role] || ROLE_ACCESS.Clerk;
  return acc === '*' || acc.includes(moduleId);
}
function requireRole(roles){ return currentUser && roles.includes(currentUser.role); }

function doLogin(name, pw){
  const u = db.users.find(u => String(u.name).trim().toLowerCase() === String(name).trim().toLowerCase());
  if (!u) return { error: 'No user found with that name.' };
  if (String(u.password) !== String(pw)) return { error: 'That password is not correct.' };
  return { user: u };
}
function startSession(user){
  currentUser = user;
  try { sessionStorage.setItem('erp_user', String(user.id)); } catch(e){}
  $('#loginScreen').hidden = true;
  $('#appShell').hidden = false;
  $('#userName').textContent = user.name;
  $('#userRole').textContent = user.role || 'User';
  $('#userAvatar').textContent = String(user.name || '?').trim().charAt(0).toUpperCase();
  renderNav();
  const first = MODULES.find(m => canAccess(m.id));
  const wanted = location.hash.replace('#/','');
  if (!wanted || !MODULES.some(m => m.id === wanted && canAccess(m.id))) location.hash = '#/' + (first ? first.id : 'dashboard');
  route();
}
function endSession(){
  currentUser = null;
  try { sessionStorage.removeItem('erp_user'); } catch(e){}
  $('#appShell').hidden = true;
  $('#loginScreen').hidden = false;
  $('#lpw').value = '';
}

/* ---------------------------- modal ---------------------------- */
function openModal({ title, bodyHTML, footHTML, onMount, width }){
  const dlg = $('#modal');
  dlg.innerHTML = `
    <div class="modal-head"><div class="modal-title">${esc(title)}</div>
      <button class="x-btn" data-close title="Close">×</button></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot">${footHTML || '<button class="btn" data-close>Close</button>'}</div>`;
  if (width) dlg.style.maxWidth = width;
  dlg.querySelectorAll('[data-close]').forEach(b => b.onclick = () => dlg.close());
  if (onMount) onMount(dlg);
  if (!dlg.open) dlg.showModal();
  const firstInput = dlg.querySelector('.modal-body input:not([type=hidden]),.modal-body select,.modal-body textarea');
  if (firstInput) setTimeout(()=>firstInput.focus(), 30);
  return dlg;
}
function closeModal(){ $('#modal').close(); }

/* Builds a labelled input grid from a field spec, and reads it back out. */
function fieldHTML(f, value){
  const v = value == null ? '' : value;
  const id = 'f_' + f.key;
  let input;
  if (f.type === 'select'){
    const opts = (typeof f.options === 'function' ? f.options() : f.options) || [];
    input = `<select class="input" id="${id}" ${f.required?'required':''}>
      ${f.allowBlank ? '<option value=""></option>' : ''}
      ${opts.map(o => {
        const val = typeof o === 'object' ? o.value : o;
        const lbl = typeof o === 'object' ? o.label : o;
        return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lbl)}</option>`;
      }).join('')}</select>`;
  } else if (f.type === 'checkbox'){
    input = `<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;color:var(--text)">
      <input type="checkbox" id="${id}" ${v ? 'checked':''}> ${esc(f.checkboxLabel || 'Yes')}</label>`;
  } else if (f.type === 'textarea'){
    input = `<textarea class="input" id="${id}" rows="${f.rows||3}">${esc(v)}</textarea>`;
  } else {
    input = `<input class="input" id="${id}" type="${f.type||'text'}" value="${esc(v)}"
      ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.required?'required':''}
      ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''} ${f.list?`list="${f.list}"`:''}>`;
  }
  return `<div class="${f.full?'full':''}">${f.type==='checkbox'?'':`<label for="${id}">${esc(f.label)}</label>`}${input}</div>`;
}
function readFields(root, fields){
  const out = {};
  for (const f of fields){
    const el = root.querySelector('#f_' + f.key);
    if (!el) continue;
    if (f.type === 'checkbox') out[f.key] = el.checked;
    else if (f.type === 'number') out[f.key] = el.value === '' ? 0 : num(el.value);
    else out[f.key] = el.value;
  }
  return out;
}
function recordModal({ title, fields, record, onSave, deleteLabel, onDelete }){
  const vals = record || {};
  openModal({
    title,
    bodyHTML: `<form id="recForm"><div class="form-grid">${fields.map(f => fieldHTML(f, vals[f.key])).join('')}</div></form>`,
    footHTML: `${onDelete ? `<button class="btn btn-danger" id="delBtn">${esc(deleteLabel||'Delete')}</button>` : ''}
               <div class="spacer"></div>
               <button class="btn" data-close>Cancel</button>
               <button class="btn btn-primary" id="saveBtn">Save</button>`,
    onMount(dlg){
      const submit = () => {
        const form = dlg.querySelector('#recForm');
        if (!form.reportValidity()) return;
        onSave(readFields(dlg, fields));
      };
      dlg.querySelector('#saveBtn').onclick = submit;
      dlg.querySelector('#recForm').onsubmit = e => { e.preventDefault(); submit(); };
      const del = dlg.querySelector('#delBtn');
      if (del) del.onclick = () => onDelete();
    }
  });
}
function confirmModal(message, onYes, yesLabel){
  openModal({
    title: 'Please confirm',
    bodyHTML: `<p style="margin:0">${message}</p>`,
    footHTML: `<div class="spacer"></div><button class="btn" data-close>Cancel</button>
               <button class="btn btn-danger" id="yesBtn">${esc(yesLabel || 'Delete')}</button>`,
    onMount(dlg){ dlg.querySelector('#yesBtn').onclick = () => { closeModal(); onYes(); }; }
  });
}

/* ---------------------------- generic list page ---------------------------- */
/* Eight screens in the workbook are "filter a list, click a row to edit", so
   they share one renderer instead of eight near-identical copies. */
function listPage({ title, subtitle, columns, rows, searchKeys, onRowClick, actionsHTML,
                    emptyText, footerHTML, filtersHTML, onFiltersMount, stateKey }){
  const state = listPage.state[stateKey] || (listPage.state[stateKey] = { q:'' });
  const q = state.q.trim().toLowerCase();
  const filtered = !q ? rows : rows.filter(r =>
    (searchKeys || []).some(k => String(typeof k === 'function' ? k(r) : r[k] ?? '').toLowerCase().includes(q)));

  $('#view').innerHTML = `
    <div class="page-head">
      <div><h1>${esc(title)}</h1>${subtitle ? `<p class="page-sub">${subtitle}</p>` : ''}</div>
      <div class="spacer"></div>
      <div class="toolbar">${actionsHTML || ''}</div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <input class="input" id="listSearch" placeholder="Search…" value="${esc(state.q)}" style="max-width:260px">
        ${filtersHTML || ''}
        <div class="spacer"></div>
        <span class="muted sm">${filtered.length} of ${rows.length}</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>${columns.map(c => `<th class="${c.align==='right'?'num':''}">${esc(c.label)}</th>`).join('')}</tr></thead>
          <tbody>
            ${filtered.length ? filtered.map((r,i) => `
              <tr class="${onRowClick?'row-link':''}" data-i="${i}">
                ${columns.map(c => `<td class="${c.align==='right'?'num':''} ${c.cls||''}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('')}
              </tr>`).join('')
            : `<tr><td colspan="${columns.length}"><div class="empty"><div class="empty-ico">◍</div>${esc(emptyText || 'Nothing here yet')}</div></td></tr>`}
          </tbody>
          ${footerHTML ? `<tfoot>${footerHTML(filtered)}</tfoot>` : ''}
        </table>
      </div>
    </div>`;

  const search = $('#listSearch');
  search.oninput = () => { state.q = search.value; const p = search.selectionStart; renderCurrent(); const s2 = $('#listSearch'); if (s2){ s2.focus(); s2.setSelectionRange(p,p); } };
  if (onRowClick){
    $$('#view tbody tr[data-i]').forEach(tr => tr.onclick = e => {
      if (e.target.closest('button,a,input,select')) return;
      onRowClick(filtered[num(tr.dataset.i)]);
    });
  }
  $$('#view [data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); });
  if (onFiltersMount) onFiltersMount();
}
listPage.state = {};

/* status -> chip colour */
function statusChip(s){
  const v = String(s || '').toLowerCase();
  let cls = '';
  if (['paid','delivered','approved','completed','active'].includes(v)) cls = 'chip-green';
  else if (['pending','ordered'].includes(v)) cls = 'chip-amber';
  else if (['closed','inactive','void'].includes(v)) cls = '';
  return `<span class="chip ${cls}">${esc(s || '—')}</span>`;
}

/* Small dependency-free bar chart so the file stays self-contained. */
function drawGroupedBars(canvas, data){
  if (!canvas) return;
  const css = getComputedStyle(document.documentElement);
  const colA = css.getPropertyValue('--accent').trim() || '#2f7bff';
  const colB = css.getPropertyValue('--amber').trim() || '#d98b06';
  const line = css.getPropertyValue('--line').trim() || '#e3e8ef';
  const muted = css.getPropertyValue('--muted').trim() || '#5b6b7b';
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 400, h = canvas.clientHeight || 210;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,w,h);
  if (!data.length){ ctx.fillStyle = muted; ctx.font = '13px sans-serif'; ctx.fillText('No data yet', 10, 24); return; }
  const padL = 52, padB = 26, padT = 10, padR = 6;
  const max = Math.max(1, ...data.flatMap(d => [d.a, d.b]));
  const niceMax = Math.pow(10, Math.floor(Math.log10(max))) * Math.ceil(max / Math.pow(10, Math.floor(Math.log10(max))));
  const plotW = w - padL - padR, plotH = h - padB - padT;
  ctx.strokeStyle = line; ctx.fillStyle = muted; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++){
    const y = padT + plotH - (plotH * i / 4);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    const v = niceMax * i / 4;
    ctx.fillText(v >= 1000 ? (v/1000).toFixed(0) + 'k' : v.toFixed(0), padL - 6, y + 3);
  }
  const slot = plotW / data.length, bw = Math.min(16, slot * 0.3);
  ctx.textAlign = 'center';
  data.forEach((d, i) => {
    const cx = padL + slot * i + slot / 2;
    const ha = plotH * Math.min(1, d.a / niceMax), hb = plotH * Math.min(1, d.b / niceMax);
    ctx.fillStyle = colA; ctx.fillRect(cx - bw - 2, padT + plotH - ha, bw, ha);
    ctx.fillStyle = colB; ctx.fillRect(cx + 2, padT + plotH - hb, bw, hb);
    ctx.fillStyle = muted; ctx.fillText(d.label, cx, h - 8);
  });
}

/* The invoice / PO editor: the workbook's main order screen, including its
   "pick a product -> fill description and the right price" behaviour. */
function orderForm(order, forceType){
  const isNew = !order;
  const type = forceType || (order && order.type) || 'INVOICE';
  const data = {
    id: order ? order.id : nextId('orders'),
    type,
    party: order ? order.party : '',
    date: order ? order.date : new Date().toISOString(),
    status: order ? order.status : (type === 'INVOICE' ? S().defaultInvoiceStatus : S().defaultPOStatus),
    account: order ? order.account : (type === 'INVOICE' ? S().defaultInvoiceAccount : S().defaultPOAccount),
    payment: order ? num(order.payment) : 0
  };
  let items = (order ? itemsForOrder(order.id) : []).map(oi => ({
    product: oi.product, productId: oi.productId, description: oi.description, qty: num(oi.qty), price: num(oi.price)
  }));
  if (!items.length) items.push({ product:'', description:'', qty:1, price:0 });

  const accounts = (S().transAccounts || []).map(a => a.name);

  function body(){
    const t = orderTotals({ type: data.type }, items);
    const partyLabel = data.type === 'INVOICE' ? 'Customer' : 'Vendor';
    const priceLabel = data.type === 'INVOICE' ? 'Sales price' : 'Item cost';
    return `
      <div class="tabs" style="margin-bottom:16px">
        <button class="tab ${data.type==='INVOICE'?'active':''}" data-type="INVOICE">Invoice (sale)</button>
        <button class="tab ${data.type==='PURCHASE'?'active':''}" data-type="PURCHASE">Purchase order</button>
      </div>
      <div class="form-grid" style="margin-bottom:18px">
        <div><label for="f_num">${data.type==='INVOICE'?'Invoice #':'PO #'}</label>
          <input class="input" id="f_num" value="${esc(data.id)}" disabled></div>
        <div><label for="f_party">${partyLabel}</label>
          <input class="input" id="f_party" list="partyOpts" value="${esc(data.party)}" placeholder="Pick or type a name" required>
          <datalist id="partyOpts">${partyList(data.type).map(n => `<option>${esc(n)}</option>`).join('')}</datalist></div>
        <div><label for="f_date">${data.type==='INVOICE'?'Invoice date':'PO date'}</label>
          <input class="input" id="f_date" type="date" value="${dateInputValue(data.date)}"></div>
        <div><label for="f_status">Status</label>
          <select class="input" id="f_status">${(S().orderStatuses||[]).map(s =>
            `<option ${data.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
        <div><label for="f_account">Account</label>
          <select class="input" id="f_account">${accounts.map(a =>
            `<option ${data.account===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div>

          </div>
        </div>
      </div>`;
  }

  function mount(dlg){
    // switch between invoice and purchase order
    dlg.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
      if (data.type === b.dataset.type) return;
      readForm(dlg);
      data.type = b.dataset.type;
      data.status = data.type === 'INVOICE' ? S().defaultInvoiceStatus : S().defaultPOStatus;
      data.account = data.type === 'INVOICE' ? S().defaultInvoiceAccount : S().defaultPOAccount;
      // re-price the lines from the other side of the product record
      items.forEach(it => {
        const p = findProduct(it.product);
        if (p) it.price = num(data.type === 'INVOICE' ? p.salesPrice : p.purchasePrice);
      });
      refresh();
    });
    dlg.querySelector('#addLine').onclick = () => { readForm(dlg); items.push({ product:'', description:'', qty:1, price:0 }); refresh(); };
    dlg.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      readForm(dlg);
      items.splice(num(b.dataset.del), 1);
      if (!items.length) items.push({ product:'', description:'', qty:1, price:0 });
      refresh();
    });
    // picking a product fills description + the price for this order type
    items.forEach((it,i) => {
      const pi = dlg.querySelector('#p_' + i);
      if (pi) pi.onchange = () => {
        readForm(dlg);
        const p = findProduct(pi.value);
        if (p){
          items[i].product = p.name;
          items[i].productId = p.id;
          items[i].description = p.description || '';
          items[i].price = num(data.type === 'INVOICE' ? p.salesPrice : p.purchasePrice);
        }
        refresh();
      };
      ['q_','r_'].forEach(prefix => {
        const el = dlg.querySelector('#' + prefix + i);
        if (el) el.onchange = () => { readForm(dlg); refresh(); };
      });
    });
    dlg.querySelector('#saveOrder').onclick = () => {
      readForm(dlg);
      if (!String(data.party).trim()) return toast('Add a customer or vendor first', 'danger');
      const lines = items.filter(it => String(it.product).trim() && num(it.qty) !== 0);
      if (!lines.length) return toast('Add at least one product line before saving', 'danger');
      saveOrder(data, lines, isNew);
    };
    const delBtn = dlg.querySelector('#delOrder');
    if (delBtn) delBtn.onclick = () => {
      const n = itemsForOrder(data.id).length;
      confirmModal(`Delete ${data.type === 'INVOICE' ? 'invoice' : 'purchase order'} #${esc(data.id)} and its ${n} line item${n===1?'':'s'}? Stock levels will adjust automatically.`, () => {
        db.orderItems = db.orderItems.filter(oi => num(oi.orderId) !== num(data.id));   // cascade
        db.orders = db.orders.filter(o => num(o.id) !== num(data.id));
        saveDB(); closeModal(); renderCurrent(); toast('Order deleted', 'ok');
      });
    };
    const pr = dlg.querySelector('#printOrder');
    if (pr) pr.onclick = () => { readForm(dlg); printOrder(data, items); };
  }
  function readForm(dlg){
    data.party = dlg.querySelector('#f_party').value;
    data.date = dlg.querySelector('#f_date').value ? new Date(dlg.querySelector('#f_date').value + 'T00:00:00').toISOString() : data.date;
    data.status = dlg.querySelector('#f_status').value;
    data.account = dlg.querySelector('#f_account').value;
    data.payment = num(dlg.querySelector('#f_payment').value);
    items.forEach((it,i) => {
      const p = dlg.querySelector('#p_'+i), d = dlg.querySelector('#d_'+i),
            q = dlg.querySelector('#q_'+i), r = dlg.querySelector('#r_'+i);
      if (p) it.product = p.value;
      if (d) it.description = d.value;
      if (q) it.qty = num(q.value);
      if (r) it.price = num(r.value);
    });
  }
  function refresh(){
    const dlg = $('#modal');
    dlg.querySelector('.modal-body').innerHTML = body();
    mount(dlg);
  }

  openModal({
    title: isNew ? `New ${type === 'INVOICE' ? 'invoice' : 'purchase order'}` : `${type === 'INVOICE' ? 'Invoice' : 'Purchase order'} #${data.id}`,
    bodyHTML: body(),
    footHTML: `${isNew ? '' : '<button class="btn btn-danger" id="delOrder">Delete</button>'}
               <button class="btn" id="printOrder">Print / PDF</button>
               <div class="spacer"></div>
               <button class="btn" data-close>Cancel</button>
               <button class="btn btn-primary" id="saveOrder">Save order</button>`,
    onMount: mount
  });
}
function findProduct(name){
  const k = String(name || '').trim().toLowerCase();
  return db.products.find(p => String(p.name).trim().toLowerCase() === k);
}
function saveOrder(data, lines, isNew){
  const totals = orderTotals(data, lines);
  const rec = {
    id: num(data.id), type: data.type, party: data.party, date: data.date, status: data.status,
    account: data.account, payment: num(data.payment), total: totals.total
  };
  const i = db.orders.findIndex(o => num(o.id) === num(rec.id));
  if (i >= 0) db.orders[i] = rec; else db.orders.push(rec);
  // replace this order's lines wholesale — simplest correct way to keep them in sync
  db.orderItems = db.orderItems.filter(oi => num(oi.orderId) !== num(rec.id));
  for (const it of lines){
    const p = findProduct(it.product);
    db.orderItems.push({
      orderId: rec.id, type: rec.type, productId: p ? p.id : (it.productId ?? null),
      product: p ? p.name : it.product, date: rec.date, description: it.description || '',
      qty: num(it.qty), price: num(it.price), total: round2(num(it.qty) * num(it.price))
    });
  }
  saveDB(); closeModal(); renderCurrent();
  toast(isNew ? 'Order created' : 'Order saved', 'ok');
}

const CONTACT_FIELDS = [
  { key:'name', label:'Name', required:true, full:true },
  { key:'address', label:'Address', full:true },
  { key:'city', label:'City' }, { key:'state', label:'State' }, { key:'zip', label:'ZIP' },

];
function contactPage(kind){
  const coll = kind === 'customers' ? 'customers' : 'vendors';
  const label = kind === 'customers' ? 'Customer' : 'Vendor';
  const orderType = kind === 'customers' ? 'INVOICE' : 'PURCHASE';
  const ordersFor = name => db.orders.filter(o => o.type === orderType && o.party === name);

  listPage({
    stateKey: coll,
    title: label + 's',
    subtitle: kind === 'customers' ? 'Who you invoice.' : 'Who you buy from.',
    rows: db[coll].slice().sort((a,b) => String(a.name).localeCompare(String(b.name))),
    searchKeys: ['name','city','state','email','phone'],
    actionsHTML: `<button class="btn btn-primary" id="addBtn">+ New ${label.toLowerCase()}</button>`,
    columns: [
      { label:'ID', key:'id' }, { label:'Name', key:'name' },
      { label:'City', key:'city' }, { label:'State', key:'state' },
      { label:'Phone', key:'phone' }, { label:'Email', key:'email' },
      { label: orderType === 'INVOICE' ? 'Invoices' : 'POs', align:'right', render:r => qty(ordersFor(r.name).length) },
      { label:'Value', align:'right', render:r => money(ordersFor(r.name).reduce((s,o) => s + orderTotals(o).total, 0)) }
    ],
    emptyText: `No ${label.toLowerCase()}s yet`,
    onRowClick: rec => contactModal(coll, label, rec, ordersFor),
    onFiltersMount(){ $('#addBtn').onclick = () => contactModal(coll, label, null, ordersFor); }
  });
}
function contactModal(coll, label, rec, ordersFor){
  const isNew = !rec;
  recordModal({
    title: isNew ? `New ${label.toLowerCase()}` : `${label}: ${rec.name}`,
    fields: CONTACT_FIELDS,
    record: rec,
    onSave(vals){
      if (!vals.name.trim()) return toast('A name is required', 'danger');
      if (isNew){
        db[coll].push(Object.assign({ id: nextId(coll) }, vals));
      } else {
        const old = rec.name;
        Object.assign(rec, vals);
        if (old !== vals.name){                    // keep orders pointing at the renamed party
          const t = coll === 'customers' ? 'INVOICE' : 'PURCHASE';
          db.orders.forEach(o => { if (o.type === t && o.party === old) o.party = vals.name; });
        }
      }
      saveDB(); closeModal(); renderCurrent(); toast(`${label} saved`, 'ok');
    },
    onDelete: isNew ? null : () => {
      const n = ordersFor(rec.name).length;
      if (n) { closeModal(); return toast(`Cannot delete — ${rec.name} is on ${n} order${n===1?'':'s'}`, 'danger'); }
      confirmModal(`Delete ${esc(label.toLowerCase())} “${esc(rec.name)}”?`, () => {
        db[coll] = db[coll].filter(r => num(r.id) !== num(rec.id));
        saveDB(); closeModal(); renderCurrent(); toast(`${label} deleted`, 'ok');
      });
    }
  });
}

function renderProducts(){
  const idx = stockIndex();

  let rows = db.products.map(p => {

    return Object.assign({}, p, { stock, value: round2(num(p.purchasePrice) * stock),

  if (st.stock === 'IN') rows = rows.filter(r => r.stock > 0);

  listPage({

      { label:'In stock', align:'right', render:r => `<strong style="color:${r.stock>0?'var(--text)':'var(--danger)'}">${qty(r.stock)}</strong>` },

      <th class="num">${money(list.reduce((s,r) => s + r.value, 0))}</th></tr>`,
    onRowClick: p => productModal(db.products.find(x => num(x.id) === num(p.id)), p.stock),

      $('#fStock').onchange = e => { st.stock = e.target.value; renderCurrent(); };
      $('#addBtn').onclick = () => productModal(null, 0);

function productModal(prod, stock){
  const isNew = !prod;
  const fields = [
    { key:'name', label:'Product name', required:true, full:true },
    { key:'upc', label:'UPC / SKU' },
    { key:'description', label:'Description', full:true },
    { key:'purchasePrice', label:'Purchase price', type:'number', step:'0.01', min:0 },
    { key:'salesPrice', label:'Sales price', type:'number', step:'0.01', min:0 }
  ];
  const lines = prod ? db.orderItems.filter(oi => String(oi.product).trim().toLowerCase() === String(prod.name).trim().toLowerCase()) : [];
  const purch = lines.filter(l => l.type === 'PURCHASE').reduce((s,l) => s + num(l.qty), 0);
  const sold  = lines.filter(l => l.type === 'INVOICE').reduce((s,l) => s + num(l.qty), 0);

  recordModal({
    title: isNew ? 'New product' : prod.name,
    fields,
    record: prod,
    onSave(vals){
      if (!vals.name.trim()) return toast('A product name is required', 'danger');
      if (isNew){
        db.products.push(Object.assign({ id: nextId('products') }, vals));
      } else {
        const old = prod.name;
        Object.assign(prod, vals);
        if (old !== vals.name){                   // order lines match on name, so keep them aligned
          db.orderItems.forEach(oi => {
            if (String(oi.product).trim().toLowerCase() === String(old).trim().toLowerCase()) oi.product = vals.name;
          });
        }
      }
      saveDB(); closeModal(); renderCurrent(); toast('Product saved', 'ok');
    },
    onDelete: isNew ? null : () => {
      if (lines.length) { closeModal(); return toast(`Cannot delete — this product is on ${lines.length} order line${lines.length===1?'':'s'}`, 'danger'); }
      confirmModal(`Delete product “${esc(prod.name)}”?`, () => {
        db.products = db.products.filter(p => num(p.id) !== num(prod.id));
        saveDB(); closeModal(); renderCurrent(); toast('Product deleted', 'ok');
      });
    }
  });
  if (!isNew){
    const body = $('#modal .modal-body');
    body.insertAdjacentHTML('beforeend', `
      <div class="panel" style="box-shadow:none;margin-top:18px">
        <div class="panel-head"><div class="panel-title">Stock movement</div></div>
        <div class="panel-pad">
          <div class="grid-3">
            <div><div class="kpi-label">Purchased in</div><div class="kpi-value">${qty(purch)}</div></div>
            <div><div class="kpi-label">Sold out</div><div class="kpi-value">${qty(sold)}</div></div>
            <div><div class="kpi-label">On hand</div>
              <div class="kpi-value" style="color:${stock>0?'var(--green)':'var(--danger)'}">${qty(stock)}</div></div>
          </div>
          <p class="muted sm" style="margin:12px 0 0">Calculated from ${lines.length} order line${lines.length===1?'':'s'} — it is not a value you type in.</p>
        </div>
      </div>`);
  }
}

  ];
  const slips = emp ? db.paidEmployees.filter(p => num(p.employeeId) === num(emp.id)) : [];
  recordModal({
    title: isNew ? 'New employee' : emp.name,
    fields,
    record: emp || { active:true, payType:'Hourly' },

      if (isNew) db.employees.push(Object.assign({ id: nextId('employees') }, vals));

        const old = emp.name;

          db.paidEmployees.forEach(p => { if (num(p.employeeId) === num(emp.id)) p.employeeName = vals.name; });
          db.payItems.forEach(p => { if (num(p.employeeId) === num(emp.id)) p.employeeName = vals.name; });

        closeModal();

        db.timesheets = db.timesheets.filter(t => num(t.employeeId) !== num(emp.id));
        db.employees = db.employees.filter(e => num(e.id) !== num(emp.id));

function renderTimesheets(){

  let rows = db.timesheets.map(t => Object.assign({}, t, { hours: entryHours(t) }))
                          .sort((a,b) => String(b.date).localeCompare(String(a.date)));
  if (st.emp !== 'ALL') rows = rows.filter(t => num(t.employeeId) === num(st.emp));
  if (st.from) { const f = parseDate(st.from); rows = rows.filter(t => parseDate(t.date) >= f); }
  if (st.to) { const e = parseDate(st.to); e.setHours(23,59,59,999); rows = rows.filter(t => parseDate(t.date) <= e); }
  const thr = num(S().overtimeDailyThreshold, 8);

  listPage({
    stateKey: 'timesheets',
    title: 'Timesheets',
    subtitle: `Clock in / out entries. Anything over ${thr} hours in a day counts as overtime.`,
    rows,
    searchKeys: ['employeeName'],
    actionsHTML: `<button class="btn btn-primary" id="addBtn">+ New entry</button>`,
    filtersHTML: `
      <select class="input" id="fEmp" style="max-width:190px">
        <option value="ALL">All employees</option>
        ${db.employees.map(e => `<option value="${e.id}" ${num(st.emp)===num(e.id)?'selected':''}>${esc(e.name)}</option>`).join('')}
      </select>
      <input class="input" id="fFrom" type="date" value="${esc(st.from)}" title="From date" style="max-width:150px">
      <input class="input" id="fTo" type="date" value="${esc(st.to)}" title="To date" style="max-width:150px">`,
    columns: [
      { label:'Entry', key:'id' },
      { label:'Date', render:t => fmtDateNice(t.date) },
      { label:'Employee', key:'employeeName' },
      { label:'In', render:t => fmtTime(t.from) },
      { label:'Out', render:t => fmtTime(t.to) },
      { label:'Hours', align:'right', render:t => qty(t.hours) },
      { label:'Regular', align:'right', render:t => qty(Math.min(t.hours, thr)) },
      { label:'Overtime', align:'right', render:t => {
          const ot = Math.max(t.hours - thr, 0);
          return ot ? `<strong style="color:var(--amber)">${qty(ot)}</strong>` : '<span class="muted">—</span>';
      } }
    ],
    emptyText: 'No timesheet entries match',
    footerHTML: list => `<tr><th colspan="5">Total hours shown</th>
      <th class="num">${qty(list.reduce((s,t) => s + t.hours, 0))}</th>
      <th class="num">${qty(list.reduce((s,t) => s + Math.min(t.hours, thr), 0))}</th>
      <th class="num">${qty(list.reduce((s,t) => s + Math.max(t.hours - thr, 0), 0))}</th></tr>`,
    onRowClick: t => timesheetModal(db.timesheets.find(x => num(x.id) === num(t.id))),
    onFiltersMount(){
      $('#fEmp').onchange = e => { st.emp = e.target.value; renderCurrent(); };
      $('#fFrom').onchange = e => { st.from = e.target.value; renderCurrent(); };
      $('#fTo').onchange = e => { st.to = e.target.value; renderCurrent(); };
      $('#addBtn').onclick = () => timesheetModal(null);
    }
  });
}
function timesheetModal(entry){
  const isNew = !entry;
  const fields = [
    { key:'employeeId', label:'Employee', type:'select', required:true,
      options:() => db.employees.filter(e => e.active || !isNew).map(e => ({ value:e.id, label:e.name })) },
    { key:'date', label:'Date', type:'date', required:true },
    { key:'from', label:'Clock in', type:'datetime-local', required:true },
    { key:'to', label:'Clock out', type:'datetime-local', required:true }
  ];
  const rec = entry ? {
    employeeId: entry.employeeId, date: dateInputValue(entry.date),
    from: dateTimeInputValue(entry.from), to: dateTimeInputValue(entry.to)
  } : { date: todayValue(), from: todayValue() + 'T08:00', to: todayValue() + 'T17:00' };

  recordModal({
    title: isNew ? 'New timesheet entry' : `Timesheet #${entry.id}`,
    fields, record: rec,
    onSave(vals){
      const emp = db.employees.find(e => num(e.id) === num(vals.employeeId));
      if (!emp) return toast('Pick an employee', 'danger');
      const payload = {
        employeeId: num(emp.id), employeeName: emp.name,
        date: new Date(vals.date + 'T00:00:00').toISOString(),
        from: new Date(vals.from).toISOString(), to: new Date(vals.to).toISOString()
      };
      if (new Date(payload.to) <= new Date(payload.from)) return toast('Clock out must be after clock in', 'danger');
      if (isNew) db.timesheets.push(Object.assign({ id: nextId('timesheets') }, payload));
      else Object.assign(entry, payload);
      saveDB(); closeModal(); renderCurrent(); toast('Timesheet saved', 'ok');
    },
    onDelete: isNew ? null : () => confirmModal('Delete this timesheet entry?', () => {
      db.timesheets = db.timesheets.filter(t => num(t.id) !== num(entry.id));
      saveDB(); closeModal(); renderCurrent(); toast('Entry deleted', 'ok');
    })
  });
}

/* ---- payroll runs ---- */

  const runId = (location.hash.split('/')[2] || '').trim();
  if (runId) return renderPayrollRun(num(runId));

  const rows = db.payrolls.slice().sort((a,b) => String(b.payDate).localeCompare(String(a.payDate)));
  listPage({
    stateKey: 'payroll',
    title: 'Payroll runs',
    subtitle: 'Pick a run to pay employees — hours come from their timesheets, tax from your settings.',

    searchKeys: ['status', r => r.id, r => fmtDate(r.payDate)],
    actionsHTML: `<button class="btn btn-primary" id="addBtn">+ New payroll run</button>`,
    columns: [
      { label:'Run', key:'id' },
      { label:'Pay date', render:r => fmtDateNice(r.payDate) },
      { label:'Period', render:r => `${esc(fmtDate(r.fromDate))} → ${esc(fmtDate(r.toDate))}` },
      { label:'Status', render:r => statusChip(r.status) },
      { label:'Employees paid', align:'right', render:r => qty(paidFor(r.id).length) },

      { label:'Net', align:'right', render:r => `<strong>${money(paidFor(r.id).reduce((s,p) => s + num(p.netPay), 0))}</strong>` }
    ],

    footerHTML: list => `<tr><th colspan="5">Totals</th>

}
function payrollRunModal(run){
  const isNew = !run;
  const fields = [
    { key:'payDate', label:'Pay date', type:'date', required:true },
    { key:'fromDate', label:'Period from', type:'date', required:true },
    { key:'toDate', label:'Period to', type:'date', required:true },
    { key:'status', label:'Status', type:'select', options:() => S().payrollStatuses }
  ];
  const rec = run ? {
    payDate: dateInputValue(run.payDate), fromDate: dateInputValue(run.fromDate),
    toDate: dateInputValue(run.toDate), status: run.status
  } : (() => {
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return { payDate: todayValue(), fromDate: fmtDate(first), toDate: fmtDate(last), status: 'Pending' };
  })();

  recordModal({
    title: isNew ? 'New payroll run' : `Payroll run #${run.id}`,
    fields, record: rec,
    onSave(vals){
      const payload = {
        payDate: new Date(vals.payDate + 'T00:00:00').toISOString(),
        fromDate: new Date(vals.fromDate + 'T00:00:00').toISOString(),
        toDate: new Date(vals.toDate + 'T00:00:00').toISOString(),
        status: vals.status
      };
      if (new Date(payload.toDate) < new Date(payload.fromDate)) return toast('Period end must be after the start', 'danger');
      if (isNew){
        const rec2 = Object.assign({ id: nextId('payrolls'), gross:0, net:0 }, payload);
        db.payrolls.push(rec2);
        saveDB(); closeModal(); location.hash = '#/payroll/' + rec2.id; toast('Payroll run created', 'ok');
      } else {
        Object.assign(run, payload);
        saveDB(); closeModal(); renderCurrent(); toast('Payroll run saved', 'ok');
      }
    },
    onDelete: isNew ? null : () => {
      const n = paidFor(run.id).length;
      confirmModal(`Delete payroll run #${esc(run.id)}${n ? ` and its ${n} payslip${n===1?'':'s'}` : ''}?`, () => {
        db.paidEmployees = db.paidEmployees.filter(p => num(p.payrollId) !== num(run.id));   // cascade
        db.payItems = db.payItems.filter(p => num(p.payrollId) !== num(run.id));
        db.payrolls = db.payrolls.filter(r => num(r.id) !== num(run.id));
        saveDB(); closeModal(); location.hash = '#/payroll'; toast('Payroll run deleted', 'ok');
      });
    }
  });
}
function renderPayrollRun(runId){
  const run = db.payrolls.find(r => num(r.id) === num(runId));
  if (!run){ location.hash = '#/payroll'; return; }
  const paid = paidFor(run.id);
  const paidByEmp = new Map(paid.map(p => [num(p.employeeId), p]));
  const employees = db.employees.filter(e => e.active || paidByEmp.has(num(e.id)))
                                .sort((a,b) => String(a.name).localeCompare(String(b.name)));
  const gross = round2(paid.reduce((s,p) => s + num(p.grossPay), 0));
  const net = round2(paid.reduce((s,p) => s + num(p.netPay), 0));
  const taxTotal = round2(db.payItems.filter(p => num(p.payrollId) === num(run.id) && p.itemType === 'Tax')
                                     .reduce((s,p) => s + num(p.amount), 0));

  $('#view').innerHTML = `
    <div class="page-head">
      <div>
        <h1>Payroll run #${esc(run.id)}</h1>
        <p class="page-sub">Pay date ${esc(fmtDateNice(run.payDate))} · period ${esc(fmtDate(run.fromDate))} → ${esc(fmtDate(run.toDate))} · ${statusChip(run.status)}</p>
      </div>
      <div class="spacer"></div>
      <div class="toolbar">
        <button class="btn" id="backBtn">← All runs</button>
        <button class="btn" id="editRun">Edit run</button>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="kpi-label">Employees paid</div><div class="kpi-value">${paid.length} <span class="muted" style="font-size:14px">/ ${employees.length}</span></div></div>
      <div class="kpi"><div class="kpi-label">Gross pay</div><div class="kpi-value">${money(gross)}</div></div>
      <div class="kpi"><div class="kpi-label">Tax withheld</div><div class="kpi-value">${money(taxTotal)}</div></div>
      <div class="kpi"><div class="kpi-label">Net pay</div><div class="kpi-value" style="color:var(--green)">${money(net)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Employees in this run</div><div class="spacer"></div>
        <span class="muted sm">click anyone to work out their pay</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Employee</th><th>Pay type</th><th class="num">Reg. hrs</th><th class="num">OT hrs</th>
            <th class="num">Gross</th><th class="num">Tax</th><th class="num">Net</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${employees.map(e => {
              const p = paidByEmp.get(num(e.id));
              const h = p ? { regHours:num(p.regHours), otHours:num(p.otHours) } : hoursInPeriod(e.id, run.fromDate, run.toDate);
              const tax = p ? round2(db.payItems.filter(x => num(x.payrollId)===num(run.id) && num(x.employeeId)===num(e.id) && x.itemType==='Tax')
                                                .reduce((s,x) => s + num(x.amount), 0)) : 0;
              return `<tr class="row-link" data-emp="${e.id}">
                <td><strong>${esc(e.name)}</strong><div class="muted sm">${esc(e.empType || '')}</div></td>
                <td><span class="chip">${esc(e.payType)}</span></td>
                <td class="num">${qty(h.regHours)}</td>
                <td class="num">${h.otHours ? `<span style="color:var(--amber)">${qty(h.otHours)}</span>` : '<span class="muted">—</span>'}</td>
                <td class="num">${p ? money(p.grossPay) : '<span class="muted">—</span>'}</td>
                <td class="num">${p ? money(tax) : '<span class="muted">—</span>'}</td>
                <td class="num">${p ? `<strong>${money(p.netPay)}</strong>` : '<span class="muted">—</span>'}</td>
                <td>${p ? '<span class="chip chip-green">Paid</span>' : '<span class="chip chip-amber">Not paid</span>'}</td>
                <td class="act">${p ? `<button class="btn btn-sm" data-slip="${e.id}">Payslip</button>` : ''}</td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr><th colspan="4">Run totals</th><th class="num">${money(gross)}</th>
            <th class="num">${money(taxTotal)}</th><th class="num">${money(net)}</th><th colspan="2"></th></tr></tfoot>
        </table>
      </div>
    </div>`;

  $('#backBtn').onclick = () => { location.hash = '#/payroll'; };
  $('#editRun').onclick = () => payrollRunModal(run);
  $$('#view tr[data-emp]').forEach(tr => tr.onclick = e => {
    if (e.target.closest('button')) return;
    payEmployeeModal(run, db.employees.find(x => num(x.id) === num(tr.dataset.emp)));
  });
  $$('#view [data-slip]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    printPayslip(run, db.employees.find(x => num(x.id) === num(b.dataset.slip)));
  });
}

/* The pay-an-employee screen: the heart of the workbook's payroll module. */
function payEmployeeModal(run, emp){
  if (!emp) return;
  const existing = db.paidEmployees.find(p => num(p.payrollId) === num(run.id) && num(p.employeeId) === num(emp.id));
  const itemsOf = t => db.payItems.filter(p => num(p.payrollId) === num(run.id) && num(p.employeeId) === num(emp.id) && p.itemType === t)
                                  .map(p => ({ name:p.itemName, amount:num(p.amount) }));
  const state = {
    payType: existing ? existing.payType : emp.payType,
    rate: existing ? num(existing.rate) : defaultRate(emp, emp.payType),
    otRate: existing ? num(existing.otRate) : num(emp.otRate),
    ptoDays: existing ? num(existing.ptoTaken) : 0,
    additions: existing ? itemsOf('Addition') : [],
    deductions: existing ? itemsOf('Deduction') : []
  };

  function calc(){
    return computePay({ employee: emp, payroll: run, payType: state.payType, rate: state.rate,
      otRate: state.otRate, ptoDays: state.ptoDays, additions: state.additions, deductions: state.deductions });
  }
  function itemRows(kind){
    const list = state[kind];
    const options = kind === 'additions' ? (S().additionItems || []) : (S().deductionItems || []);
    return `
      <table class="items-table">
        <tbody>
          ${list.length ? list.map((it,i) => `
            <tr><td><input id="${kind}_n_${i}" list="${kind}Opts" value="${esc(it.name)}" placeholder="Item name"></td>
                <td class="num" style="width:120px"><input id="${kind}_a_${i}" type="number" step="0.01" value="${num(it.amount)}"></td>
                <td style="width:34px"><button class="btn btn-sm btn-danger" data-rm="${kind}:${i}">×</button></td></tr>`).join('')
            : `<tr><td class="muted sm" colspan="3">None</td></tr>`}
        </tbody>
      </table>
      <datalist id="${kind}Opts">${options.map(o => `<option>${esc(o)}</option>`).join('')}</datalist>
      <button class="btn btn-sm" data-add="${kind}" style="margin-top:8px">+ Add ${kind === 'additions' ? 'addition' : 'deduction'}</button>`;
  }
  function body(){
    const c = calc();
    const isHourly = c.payType === 'Hourly' || c.payType === 'Freelance';
    return `
      <div class="form-grid" style="margin-bottom:16px">
        <div><label>Employee</label><input class="input" value="${esc(emp.name)}" disabled></div>
        <div><label for="f_payType">Pay type</label>
          <select class="input" id="f_payType">${(S().payTypes||[]).map(t =>
            `<option ${c.payType===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
        <div><label for="f_rate">${isHourly ? 'Hourly rate' : 'Amount this period'}</label>
          <input class="input" id="f_rate" type="number" step="0.01" value="${num(state.rate)}"></div>
        <div><label for="f_otRate">Overtime rate</label>
          <input class="input" id="f_otRate" type="number" step="0.01" value="${num(state.otRate)}" ${isHourly?'':'disabled'}></div>
        <div><label for="f_pto">PTO days taken</label>
          <input class="input" id="f_pto" type="number" step="0.5" min="0" value="${num(state.ptoDays)}"></div>
      </div>

      <div class="grid-2">
        <div class="panel" style="box-shadow:none">
          <div class="panel-head"><div class="panel-title">Hours from timesheets</div></div>
          <div class="panel-pad">
            <div class="totals" style="margin:0">
              <div class="totals-row"><span class="muted">Regular hours</span><span class="mono">${qty(c.regHours)}</span></div>
              <div class="totals-row"><span class="muted">Overtime hours</span><span class="mono">${qty(c.otHours)}</span></div>
              <div class="totals-row"><span class="muted">Entries in period</span><span class="mono">${c.entries.length}</span></div>
            </div>
            ${isHourly ? '' : '<p class="muted sm" style="margin:12px 0 0">Salaried — hours are informational only.</p>'}
          </div>
        </div>
        <div class="panel" style="box-shadow:none">
          <div class="panel-head"><div class="panel-title">Tax withheld</div></div>
          <div class="table-wrap">
            <table><tbody>
              ${c.taxes.map(t => `<tr><td>${esc(t.name)} <span class="muted sm">${(t.rate*100).toFixed(2)}%</span></td>
                <td class="num mono">${money(t.amount)}</td></tr>`).join('')}
              <tr><td><strong>Total tax</strong></td><td class="num mono"><strong>${money(c.taxTotal)}</strong></td></tr>
            </tbody></table>
          </div>
        </div>
      </div>

      <div class="grid-2" style="margin-top:16px">
        <div class="panel" style="box-shadow:none">
          <div class="panel-head"><div class="panel-title">Additions</div></div>
          <div class="panel-pad">${itemRows('additions')}</div>
        </div>
        <div class="panel" style="box-shadow:none">
          <div class="panel-head"><div class="panel-title">Deductions</div></div>
          <div class="panel-pad">${itemRows('deductions')}</div>
        </div>
      </div>

      <div class="panel" style="box-shadow:none;margin-top:16px">
        <div class="panel-pad" style="display:flex">
          <div class="totals">
            <div class="totals-row"><span class="muted">Regular pay</span><span class="mono">${money(c.regPay)}</span></div>
            <div class="totals-row"><span class="muted">Overtime pay</span><span class="mono">${money(c.otPay)}</span></div>
            ${c.ptoPay ? `<div class="totals-row"><span class="muted">PTO pay</span><span class="mono">${money(c.ptoPay)}</span></div>` : ''}
            <div class="totals-row"><span class="muted">Additions</span><span class="mono">${money(c.additionsTotal)}</span></div>
            <div class="totals-row grand"><span>Gross pay</span><span class="mono">${money(c.grossPay)}</span></div>
            <div class="totals-row"><span class="muted">Less tax</span><span class="mono">−${money(c.taxTotal)}</span></div>
            <div class="totals-row"><span class="muted">Less deductions</span><span class="mono">−${money(c.deductionsTotal)}</span></div>
            <div class="totals-row grand"><span>Net pay</span><span class="mono" style="color:var(--green)">${money(c.netPay)}</span></div>
          </div>
        </div>
      </div>`;
  }
  function read(dlg){
    state.payType = dlg.querySelector('#f_payType').value;
    state.rate = num(dlg.querySelector('#f_rate').value);
    state.otRate = num(dlg.querySelector('#f_otRate').value);
    state.ptoDays = num(dlg.querySelector('#f_pto').value);
    ['additions','deductions'].forEach(kind => {
      state[kind] = state[kind].map((it,i) => {
        const n = dlg.querySelector(`#${kind}_n_${i}`), a = dlg.querySelector(`#${kind}_a_${i}`);
        return { name: n ? n.value : it.name, amount: a ? num(a.value) : num(it.amount) };
      });
    });
  }
  function refresh(){
    const dlg = $('#modal');
    dlg.querySelector('.modal-body').innerHTML = body();
    mount(dlg);
  }
  function mount(dlg){
    ['#f_payType','#f_rate','#f_otRate','#f_pto'].forEach(sel => {
      const el = dlg.querySelector(sel);
      if (!el) return;
      el.onchange = () => {
        const prevType = state.payType;
        read(dlg);
        if (sel === '#f_payType' && prevType !== state.payType) state.rate = defaultRate(emp, state.payType);
        refresh();
      };
    });
    dlg.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
      read(dlg);
      const kind = b.dataset.add;
      const opts = kind === 'additions' ? (S().additionItems||[]) : (S().deductionItems||[]);
      state[kind].push({ name: opts[0] || '', amount: 0 });
      refresh();
    });
    dlg.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
      read(dlg);
      const [kind, i] = b.dataset.rm.split(':');
      state[kind].splice(num(i), 1);
      refresh();
    });
    dlg.querySelector('#savePay').onclick = () => { read(dlg); savePay(); };
    const un = dlg.querySelector('#unpayBtn');
    if (un) un.onclick = () => confirmModal(`Remove ${esc(emp.name)} from payroll run #${esc(run.id)}?`, () => {
      db.paidEmployees = db.paidEmployees.filter(p => !(num(p.payrollId) === num(run.id) && num(p.employeeId) === num(emp.id)));
      db.payItems = db.payItems.filter(p => !(num(p.payrollId) === num(run.id) && num(p.employeeId) === num(emp.id)));
      recalcRunTotals(run.id); saveDB(); closeModal(); renderCurrent(); toast('Payslip removed', 'ok');
    }, 'Remove');
  }
  function savePay(){
    const c = calc();
    const payload = {
      payrollId: num(run.id), payDate: run.payDate, employeeId: num(emp.id), employeeName: emp.name,
      payType: c.payType, rate: c.rate, otRate: c.otRate, ptoTaken: c.ptoDays,
      regHours: c.regHours, otHours: c.otHours, regPay: c.regPay, otPay: c.otPay,
      grossPay: c.grossPay, netPay: c.netPay
    };
    if (existing) Object.assign(existing, payload);
    else db.paidEmployees.push(Object.assign({ id: nextId('paidEmployees') }, payload));

    // rewrite this employee's pay items for this run
    db.payItems = db.payItems.filter(p => !(num(p.payrollId) === num(run.id) && num(p.employeeId) === num(emp.id)));
    const push = (itemType, name, amount) => db.payItems.push({
      payrollId: num(run.id), payDate: run.payDate, employeeId: num(emp.id), employeeName: emp.name,
      itemType, itemName: name, amount: round2(amount)
    });
    c.taxes.forEach(t => push('Tax', t.name, t.amount));
    c.additions.forEach(a => push('Addition', a.name, a.amount));
    c.deductions.forEach(d => push('Deduction', d.name, d.amount));
    if (c.ptoDays) push('PTO', fmtDate(run.payDate), c.ptoDays);

    recalcRunTotals(run.id);
    saveDB(); closeModal(); renderCurrent();
    toast(`${emp.name} paid ${money(c.netPay)}`, 'ok');
  }

  openModal({
    title: `${existing ? 'Edit pay for' : 'Pay'} ${emp.name} — run #${run.id}`,
    bodyHTML: body(),
    footHTML: `${existing ? '<button class="btn btn-danger" id="unpayBtn">Remove payslip</button>' : ''}
               <div class="spacer"></div><button class="btn" data-close>Cancel</button>
               <button class="btn btn-primary" id="savePay">${existing ? 'Update payslip' : 'Save payslip'}</button>`,
    onMount: mount
  });
}

function transactionModal(tr){
  const isNew = !tr;
  const fields = [
    { key:'name', label:'Transaction name', required:true, full:true },
    { key:'date', label:'Date', type:'date', required:true },
    { key:'account', label:'Account', type:'select', options:() => (S().transAccounts||[]).map(a => a.name) },
    { key:'amount', label:'Amount', type:'number', step:'0.01' },
    { key:'notes', label:'Notes', type:'textarea', full:true }
  ];
  const rec = tr ? Object.assign({}, tr, { date: dateInputValue(tr.date) })
                 : { date: todayValue(), account: (S().transAccounts[0]||{}).name, amount: 0 };
  recordModal({
    title: isNew ? 'New transaction' : `Transaction #${tr.id}`,
    fields, record: rec,
    onSave(vals){
      if (!vals.name.trim()) return toast('A transaction name is required', 'danger');
      const acct = (S().transAccounts||[]).find(a => a.name === vals.account);
      const payload = {
        name: vals.name, date: new Date(vals.date + 'T00:00:00').toISOString(),
        account: vals.account, accountType: acct ? acct.type : 'Expense',
        amount: num(vals.amount), notes: vals.notes
      };
      if (isNew) db.transactions.push(Object.assign({ id: nextId('transactions') }, payload));
      else Object.assign(tr, payload);
      saveDB(); closeModal(); renderCurrent(); toast('Transaction saved', 'ok');
    },
    onDelete: isNew ? null : () => confirmModal(`Delete transaction “${esc(tr.name)}”?`, () => {
      db.transactions = db.transactions.filter(x => num(x.id) !== num(tr.id));
      saveDB(); closeModal(); renderCurrent(); toast('Transaction deleted', 'ok');
    })
  });
}

  const stockValue = round2(db.products.reduce((s,p) => s + num(p.purchasePrice) * productStock(p.name, idx), 0));
  const retailValue = round2(db.products.reduce((s,p) => s + num(p.salesPrice) * Math.max(0, productStock(p.name, idx)), 0));

  // by account within the chosen window
  const f = parseDate(st.from), t = parseDate(st.to);
  if (t) t.setHours(23,59,59,999);
  const byAcct = {};
  for (const tr of db.transactions){
    const d = parseDate(tr.date);
    if (f && (!d || d < f)) continue;
    if (t && (!d || d > t)) continue;
    const k = tr.account || '—';
    byAcct[k] = byAcct[k] || { type: tr.accountType, amount: 0, count: 0 };
    byAcct[k].amount += num(tr.amount); byAcct[k].count++;
  }
  const accts = Object.entries(byAcct).sort((a,b) => b[1].amount - a[1].amount);

  // payroll cost by month
  const payByMonth = {};
  for (const p of db.paidEmployees){
    const k = monthKey(p.payDate); if (!k) continue;
    payByMonth[k] = (payByMonth[k] || 0) + num(p.grossPay);

  $('#view').innerHTML = `

      <div class="kpi"><div class="kpi-label">Cost of goods</div><div class="kpi-value">${money(pl.COGS)}</div></div>
      <div class="kpi"><div class="kpi-label">Expenses</div><div class="kpi-value">${money(pl.Expense)}</div></div>
      <div class="kpi"><div class="kpi-label">Net profit</div>
        <div class="kpi-value" style="color:${pl.net>=0?'var(--green)':'var(--danger)'}">${money(pl.net)}</div></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Profit &amp; loss by account</div></div>
        <div class="table-wrap">
          <table><thead><tr><th>Account</th><th>Type</th><th class="num">Entries</th><th class="num">Amount</th></tr></thead>
            <tbody>${accts.length ? accts.map(([name,v]) => `
              <tr><td>${esc(name)}</td>
                  <td><span class="chip ${v.type==='Income'?'chip-green':(v.type==='COGS'?'chip-amber':'')}">${esc(v.type)}</span></td>
                  <td class="num">${v.count}</td><td class="num mono">${money(v.amount)}</td></tr>`).join('')
              : `<tr><td colspan="4"><div class="empty">No transactions in this period</div></td></tr>`}
            </tbody>
            <tfoot><tr><th colspan="3">Net</th>
              <th class="num" style="color:${pl.net>=0?'var(--green)':'var(--danger)'}">${money(pl.net)}</th></tr></tfoot>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Payroll cost by month</div></div>
        <div class="panel-body">
          <div class="chart-box"><canvas id="chartPay"></canvas></div>
          <div class="legend"><div class="legend-item"><span class="dot" style="background:var(--accent)"></span>Gross payroll</div></div>
        </div>

          <div><div class="kpi-label">At retail (positive stock)</div><div class="kpi-value">${money(retailValue)}</div></div>
          <div><div class="kpi-label">Potential margin</div><div class="kpi-value" style="color:var(--green)">${money(retailValue - stockValue)}</div></div>
        </div>
      </div>
    </div>`;

  drawGroupedBars($('#chartPay'), payMonths.map(k => ({ label: monthLabel(k), a: payByMonth[k], b: 0 })));
  $('#rFrom').onchange = e => { st.from = e.target.value; renderCurrent(); };
  $('#rTo').onchange = e => { st.to = e.target.value; renderCurrent(); };

function userModal(user){
  const isNew = !user;
  const fields = [
    { key:'name', label:'User name', required:true, full:true },
    { key:'password', label:'Password', required:true },
    { key:'role', label:'Role', type:'select', options:() => S().userTypes }
  ];
  recordModal({
    title: isNew ? 'New user' : user.name,
    fields,
    record: user || { role:'Clerk' },
    onSave(vals){
      if (!vals.name.trim()) return toast('A user name is required', 'danger');
      const clash = db.users.find(u => String(u.name).trim().toLowerCase() === vals.name.trim().toLowerCase()
                                    && (!user || num(u.id) !== num(user.id)));
      if (clash) return toast('Another user already has that name', 'danger');
      if (isNew) db.users.push(Object.assign({ id: nextId('users') }, vals));
      else {
        Object.assign(user, vals);
        if (num(user.id) === num(currentUser.id)){ currentUser = user; $('#userRole').textContent = user.role; $('#userName').textContent = user.name; renderNav(); }
      }
      saveDB(); closeModal(); renderCurrent(); toast('User saved', 'ok');
    },
    onDelete: isNew ? null : () => {
      if (num(user.id) === num(currentUser.id)){ closeModal(); return toast('You cannot delete the account you are signed in with', 'danger'); }
      const admins = db.users.filter(u => u.role === 'Admin');
      if (user.role === 'Admin' && admins.length <= 1){ closeModal(); return toast('Keep at least one Admin', 'danger'); }
      confirmModal(`Delete user “${esc(user.name)}”?`, () => {
        db.users = db.users.filter(u => num(u.id) !== num(user.id));
        saveDB(); closeModal(); renderCurrent(); toast('User deleted', 'ok');
      });
    }
  });
}
