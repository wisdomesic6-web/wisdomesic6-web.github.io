          <button class="btn btn-danger" id="resetBtn">Reset to workbook data</button>
        </div>
      </div>
    </div>`;

  $('#saveCompany').onclick = () => {
    s.companyName = $('#s_company').value.trim() || 'Ultimate ERP';
    s.salesTaxRate = num($('#s_salesTax').value) / 100;
    s.poTaxRate = num($('#s_poTax').value) / 100;
    s.overtimeDailyThreshold = num($('#s_ot').value, 8);
    s.payFrequency = $('#s_freq').value;
    s.defaultInvoiceStatus = $('#s_invStatus').value;
    s.defaultPOStatus = $('#s_poStatus').value;
    saveDB(); applyBrand(); renderCurrent(); toast('Settings saved', 'ok');
  };
  $('#addTax').onclick = () => taxModal(null);
  $$('#view [data-tax]').forEach(b => b.onclick = () => taxModal(num(b.dataset.tax)));
  $('#addAcct').onclick = () => acctModal(null);
  $$('#view [data-acct]').forEach(b => b.onclick = () => acctModal(num(b.dataset.acct)));
  bindListEditors();

  $('#exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `erp-backup-${fmtDate(new Date())}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('Backup downloaded', 'ok');
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.orders)) throw new Error('not an ERP backup');
        confirmModal('Replace everything currently in this browser with the contents of that file?', () => {
          db = parsed; migrate(); saveDB(); applyBrand(); renderNav(); renderCurrent(); toast('Backup restored', 'ok');
        }, 'Replace');
      } catch(err){ toast('That file is not a valid ERP backup', 'danger'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  $('#resetBtn').onclick = () => confirmModal(
    'Throw away every change made in this browser and go back to the original workbook data?',
    () => { resetDB(); applyBrand(); renderNav(); renderCurrent(); toast('Data reset to the workbook', 'ok'); }, 'Reset');
}
function listEditorPanel(title, key){
  const items = S()[key] || [];
  return `
    <div class="panel">
      <div class="panel-head"><div class="panel-title">${esc(title)}</div><div class="spacer"></div>
        <button class="btn btn-sm" data-list-add="${key}">+</button></div>
      <div class="panel-pad">
        <div class="bar-list">
          ${items.length ? items.map((v,i) => `
            <div style="display:flex;gap:8px;align-items:center">
              <input class="input" data-list-item="${key}:${i}" value="${esc(v)}">
              <button class="btn btn-sm btn-danger" data-list-del="${key}:${i}">×</button>
            </div>`).join('') : '<span class="muted sm">Empty</span>'}
        </div>
      </div>
    </div>`;
}
function bindListEditors(){
  $$('#view [data-list-add]').forEach(b => b.onclick = () => {
    const key = b.dataset.listAdd;
    S()[key] = (S()[key] || []).concat('New item');
    saveDB(); renderCurrent();
  });
  $$('#view [data-list-del]').forEach(b => b.onclick = () => {
    const [key, i] = b.dataset.listDel.split(':');
    S()[key].splice(num(i), 1); saveDB(); renderCurrent(); toast('Removed', 'ok');
  });
  $$('#view [data-list-item]').forEach(inp => inp.onchange = () => {
    const [key, i] = inp.dataset.listItem.split(':');
    S()[key][num(i)] = inp.value; saveDB(); toast('Saved', 'ok');
  });
}
function taxModal(i){
  const isNew = i == null;
  const t = isNew ? { name:'', wagePercent:0, baseLimit:null } : S().taxItems[i];
  recordModal({
    title: isNew ? 'New tax item' : t.name,
    fields: [
      { key:'name', label:'Tax name', required:true, full:true },
      { key:'percent', label:'Wage percent (%)', type:'number', step:'0.001' },
      { key:'baseLimit', label:'Annual wage cap (blank = none)', type:'number', step:'1' }
    ],
    record: { name:t.name, percent: round2(num(t.wagePercent)*100*1000)/1000, baseLimit: t.baseLimit || '' },
    onSave(vals){
      const rec = { name: vals.name, wagePercent: num(vals.percent)/100, baseLimit: num(vals.baseLimit) || null };
      if (isNew) S().taxItems.push(rec); else S().taxItems[i] = rec;
      saveDB(); closeModal(); renderCurrent(); toast('Tax item saved', 'ok');
    },
    onDelete: isNew ? null : () => confirmModal(`Delete tax item “${esc(t.name)}”?`, () => {
      S().taxItems.splice(i,1); saveDB(); closeModal(); renderCurrent(); toast('Tax item deleted', 'ok');
    })
  });
}
function acctModal(i){
  const isNew = i == null;
  const a = isNew ? { name:'', type:'Expense' } : S().transAccounts[i];
  recordModal({
    title: isNew ? 'New ledger account' : a.name,
    fields: [
      { key:'name', label:'Account name', required:true, full:true },
      { key:'type', label:'Type', type:'select', options:['Income','Expense','COGS'] }
    ],
    record: a,
    onSave(vals){
      const old = a.name;
      if (isNew) S().transAccounts.push({ name: vals.name, type: vals.type });
      else {
        S().transAccounts[i] = { name: vals.name, type: vals.type };
        db.transactions.forEach(t => { if (t.account === old){ t.account = vals.name; t.accountType = vals.type; } });
      }
      saveDB(); closeModal(); renderCurrent(); toast('Account saved', 'ok');
    },
    onDelete: isNew ? null : () => {
      const n = db.transactions.filter(t => t.account === a.name).length;
      if (n){ closeModal(); return toast(`Cannot delete — ${n} transaction${n===1?'':'s'} use this account`, 'danger'); }
      confirmModal(`Delete account “${esc(a.name)}”?`, () => {
        S().transAccounts.splice(i,1); saveDB(); closeModal(); renderCurrent(); toast('Account deleted', 'ok');
      });
    }
  });
}

/* ====================================================================== */
/*  NAVIGATION & ROUTING                                                  */
/* ====================================================================== */
const MODULES = [
  { id:'dashboard',    label:'Dashboard',          group:'Overview',           icon:'▤', render:renderDashboard },
  { id:'orders',       label:'Invoices & orders',  group:'Sales & purchasing', icon:'❐', render:renderOrders },
  { id:'customers',    label:'Customers',          group:'Sales & purchasing', icon:'☺', render:() => contactPage('customers') },
  { id:'vendors',      label:'Vendors',            group:'Sales & purchasing', icon:'⚑', render:() => contactPage('vendors') },
  { id:'products',     label:'Products & stock',   group:'Sales & purchasing', icon:'▣', render:renderProducts },
  { id:'employees',    label:'Employees',          group:'People & payroll',   icon:'♟', render:renderEmployees },
  { id:'timesheets',   label:'Timesheets',         group:'People & payroll',   icon:'◷', render:renderTimesheets },
  { id:'payroll',      label:'Payroll runs',       group:'People & payroll',   icon:'₦', render:renderPayroll },
  { id:'transactions', label:'Ledger',             group:'Accounts',           icon:'≡', render:renderTransactions },
  { id:'reports',      label:'Reports',            group:'Accounts',           icon:'◫', render:renderReports },
  { id:'users',        label:'Users & access',     group:'Administration',     icon:'⚿', render:renderUsers, adminOnly:true },
  { id:'settings',     label:'Settings',           group:'Administration',     icon:'⚙', render:renderSettings, adminOnly:true }
];

function visibleModules(){
  return MODULES.filter(m => canAccess(m.id) && (!m.adminOnly || requireRole(['Admin'])));
}
function renderNav(){
  const mods = visibleModules();
  const groups = [];
  for (const m of mods){
    let g = groups.find(x => x.name === m.group);
    if (!g){ g = { name: m.group, items: [] }; groups.push(g); }
    g.items.push(m);
  }
  const active = currentModuleId();
  $('#nav').innerHTML = groups.map(g => `
    <div class="nav-group">
      <div class="nav-group-label">${esc(g.name)}</div>
      ${g.items.map(m => `<a class="nav-item ${m.id===active?'active':''}" href="#/${m.id}">
        <span class="nav-ico">${m.icon}</span>${esc(m.label)}</a>`).join('')}
    </div>`).join('');
}
function currentModuleId(){ return (location.hash.replace('#/','').split('/')[0]) || 'dashboard'; }
function renderCurrent(){ route(); }
function route(){
  if (!currentUser) return;
  const id = currentModuleId();
  const mod = visibleModules().find(m => m.id === id);
  if (!mod){
    const first = visibleModules()[0];
    if (first && id !== first.id){ location.hash = '#/' + first.id; return; }
    $('#view').innerHTML = `<div class="panel"><div class="empty">You do not have access to this area.</div></div>`;
    return;
  }
  renderNav();
  try { mod.render(); }
  catch(err){
    console.error(err);
    $('#view').innerHTML = `<div class="panel panel-pad"><strong>Something went wrong rendering this screen.</strong>
      <pre class="muted sm" style="white-space:pre-wrap">${esc(err.message)}</pre></div>`;
  }
  window.scrollTo({ top:0 });
}

/* ---------------------------- global search ---------------------------- */
function globalSearch(q){
  const term = q.trim().toLowerCase();
  const box = $('#searchResults');
  if (term.length < 2){ box.className = 'results'; box.innerHTML = ''; return; }
  const groups = [];
  const add = (label, items) => { if (items.length) groups.push({ label, items }); };
  const match = v => String(v ?? '').toLowerCase().includes(term);

  if (canAccess('orders')) add('Orders', db.orders.filter(o => match(o.party) || match(o.id) || match(o.status))
    .slice(0,5).map(o => ({ text:`${o.type} #${o.id} — ${o.party}`, meta: money(orderTotals(o).total), go:() => { location.hash = '#/orders'; setTimeout(() => orderForm(o), 60); } })));
  if (canAccess('products')) add('Products', db.products.filter(p => match(p.name) || match(p.upc))
    .slice(0,5).map(p => ({ text:p.name, meta:`${qty(productStock(p.name))} in stock`, go:() => { location.hash = '#/products'; setTimeout(() => productModal(p, productStock(p.name)), 60); } })));
  if (canAccess('customers')) add('Customers', db.customers.filter(c => match(c.name) || match(c.email))
    .slice(0,4).map(c => ({ text:c.name, meta:c.city || '', go:() => { location.hash = '#/customers'; } })));
  if (canAccess('vendors')) add('Vendors', db.vendors.filter(v => match(v.name) || match(v.email))
    .slice(0,4).map(v => ({ text:v.name, meta:v.city || '', go:() => { location.hash = '#/vendors'; } })));
  if (canAccess('employees')) add('Employees', db.employees.filter(e => match(e.name) || match(e.empType))
    .slice(0,4).map(e => ({ text:e.name, meta:e.empType || '', go:() => { location.hash = '#/employees'; setTimeout(() => employeeModal(e), 60); } })));
  if (canAccess('transactions')) add('Ledger', db.transactions.filter(t => match(t.name) || match(t.account) || match(t.notes))
    .slice(0,5).map(t => ({ text:t.name, meta: money(t.amount), go:() => { location.hash = '#/transactions'; } })));

  box.innerHTML = groups.length ? groups.map((g,gi) => `
    <div class="result-group"><div class="result-label">${esc(g.label)}</div>
      ${g.items.map((it,ii) => `<div class="result-row" data-go="${gi}:${ii}">
        <span>${esc(it.text)}</span><span class="meta">${esc(it.meta)}</span></div>`).join('')}
    </div>`).join('') : `<div class="result-group"><div class="result-row muted">No matches for “${esc(q)}”</div></div>`;
  box.className = 'results show';
  $$('#searchResults [data-go]').forEach(row => row.onclick = () => {
    const [gi, ii] = row.dataset.go.split(':').map(Number);
    box.className = 'results'; $('#globalSearch').value = '';
    groups[gi].items[ii].go();
  });
}

/* ---------------------------- boot ---------------------------- */
function applyBrand(){
  const name = (S().companyName || 'Ultimate ERP');
  $('#sideBrand').textContent = name;
  $('#loginBrand').textContent = name;
  document.title = name + ' — ERP';
}
function boot(){
  loadDB();
  applyBrand();

  // login screen
  $('#userNames').innerHTML = db.users.map(u => `<option>${esc(u.name)}</option>`).join('');
  const admin = db.users.find(u => u.role === 'Admin');
  $('#loginHint').innerHTML = `<strong>Test sign-in:</strong> ${esc(admin ? admin.name : db.users[0].name)}
    / password <code>${esc(admin ? admin.password : db.users[0].password)}</code>.
    Sign-in is for separating departments while you test — it is not real security yet.`;

  $('#loginForm').onsubmit = e => {
    e.preventDefault();
    const res = doLogin($('#luser').value, $('#lpw').value);
    const err = $('#loginErr');
    if (res.error){ err.textContent = res.error; err.className = 'err show'; return; }
    err.className = 'err';
    startSession(res.user);
  };
  $('#logoutBtn').onclick = endSession;
  $('#themeBtn').onclick = () => { toggleTheme(); if (currentUser) renderCurrent(); };

  const gs = $('#globalSearch');
  gs.oninput = () => globalSearch(gs.value);
  gs.onkeydown = e => { if (e.key === 'Escape'){ gs.value = ''; $('#searchResults').className = 'results'; } };
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) $('#searchResults').className = 'results';
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', () => { if (currentUser && ['dashboard','reports'].includes(currentModuleId())) renderCurrent(); });

  // restore a session on reload
  let savedId = null;
  try { savedId = sessionStorage.getItem('erp_user'); } catch(e){}
  const saved = savedId && db.users.find(u => String(u.id) === String(savedId));
  if (saved) startSession(saved); else $('#luser').focus();
}
boot();
</script>
